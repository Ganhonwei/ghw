	<div class="form-group">
		<label for="name" class="col-sm-2 control-label">物品名称</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="name" name="name" value="{{.name}}" autocomplete="off" />
		</div>
	</div>

	<div class="form-group">
		<label for="number" class="col-sm-2 control-label">购买数量</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="number" name="number" value="{{.number}}" autocomplete="off" />
		</div>
	</div>

	<div class="form-group">
		<label for="price" class="col-sm-2 control-label">支付价格</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="price" name="price" value="{{.price}}" autocomplete="off" />
		</div>
	</div>

  <div class="form-group">
		<label for="give" class="col-sm-2 control-label">赠送数量</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="give" name="give" value="{{.give}}" autocomplete="off" />
		</div>
	</div>
  <div class="form-group">
		<label for="give" class="col-sm-2 control-label">赠送类型</label>
		<div class="col-sm-3">
			<select name="givetype" id="givetype" style="width: 120px;">
				{{range $k,$v := .typeList}}
				<option value="{{$k}}" >{{$v}}</option>
				{{end}}
			</select>
		</div>
	</div>
	<div class="form-group">
		<label for="give" class="col-sm-2 control-label">打码量倍数</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="flow" name="flow" value="{{.FlowMultiple}}" autocomplete="off" />
		</div>
	</div>
	<div class="form-group">
		<label for="info" class="col-sm-2 control-label">商品描述</label>
		<div class="col-sm-5">
			<textarea name="info" id="info" class="form-control" rows="6" value="{{.info}}"></textarea>	
		</div>
	</div>

	<div class="clearfix form-actions">
		<div class="col-sm-offset-2 col-sm-10">
			<button type="submit" class="btn btn-info"><i class="ace-icon fa fa-check bigger-110"></i>提交</button>
			<a href="{{urlfor "PayController.ShopList"}}" class="btn btn-default"><i class="ace-icon fa fa-reply bigger-110"></i>返回</a>
		</div>
	</div>
</form>
