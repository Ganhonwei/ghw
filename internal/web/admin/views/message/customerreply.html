<div class="alert alert-warning alert-dismissible hide" role="alert"></div>

<form class="form-horizontal ajax-form" method="post" action="{{urlfor "MessageController.CustomerReply"}}">
	<div style="border: 1px solid #DCDFE6; padding: 10px;">
		<input type="hidden" name="userid" value="{{.userid}}" />
		<div class="form-group" style="border-bottom:1px solid #DCDFE6">
			<div class="col-sm-12" style="padding-bottom:10px;">
				<label for="number"  class="col-sm-2 lable-top">用户ID:{{.info.Userid}}</label>
				<label for="number"  class="col-sm-2 lable-top">用户名:{{.info.Nickname}}</label>
				<label for="number"  class="col-sm-2 lable-top">VIP等级:{{.info.VipLv}}</label> <!--{{.info.ChargeType}}-->
				<label for="number"  class="col-sm-2 lable-top">渠道:{{.info.BundleId}}</label>
				{{if eq .info.OnlineStatus true}}
					<label for="number"  class="col-sm-2 lable-top green">在线</label>
				{{else}}
					<label for="number"  class="col-sm-2 lable-top gray">离线</label>
				{{end}}
				<div style="display: inline-block; float: right;">
					<a href="{{urlfor "MessageController.Customer"}}" class="btn btn-default"><i class="fa fa-close"></i></a>
				</div>
			</div>
		</div>
		<div class="form-group">
			<div class="col-sm-12 msg-content">
				<ul>
					
					{{range $k, $v := .info.Logs}}
						{{if eq $v.Sender "-1"}}
						<li class="sender-content">
							<p><span class="info-time">{{ date $v.Ctime "Y-m-d H:i:s" }}</span>&nbsp; {{$v.Name}}</p>
							<div class="msg-reply-content">{{ $v.Content }}</div>
							
						</li>
						{{else}}
						<li>
							<p>{{$v.Name}}<span class="info-time">{{ date $v.Ctime "Y-m-d H:i:s" }}</span></p>
							<div class="msg-send-content">{{ $v.Content }}</div>
						</li>
						{{end}}
					{{end}}
				</ul>
			</div>
		</div>
		<div class="form-group">
			<div class="col-sm-12" style="padding: 10px;">
				<textarea name="content" id="content" class="form-control" rows="5" maxlength="200"></textarea>
			</div>
			<div style="float: right; padding-right: 10px;">
				<button type="submit" class="btn btn-info">发送</button>
			</div>
		</div>
	</div>
</form>


<style type="text/css" >
	.msg-content ul{
		padding: 0px !important;
		margin: 0px !important;
		height: 500px;
		overflow: hidden;
		overflow-y: auto;
	}
	.msg-content ul li {
		list-style:none;
		line-height: 30px;
		font-size: 16px;
		color: #606266;
		padding: 5px;
		margin-bottom: 10px;
	}	
	.info-time{
		font-size: 10px;
		color: #C0C4CC;
		padding-left:10px;
	}
	.msg-reply{
		text-align: right;
		
	}
	.msg-reply-content{
		padding: 5px;
		border: 1px solid #67C23A !important;
  		border-radius: 5px;
		display: inline-block;
		max-width: 95%;
		word-wrap: break-word;
		text-align: left;
	}
	.msg-send-content{
		padding: 5px;
		border: 1px solid #F56C6C !important;
  		border-radius: 5px;
		display: inline-block;
		max-width: 95%;
		word-wrap: break-word;
		text-align: left;
	}
	.sender-content{
		text-align: right;
	}
</style>
