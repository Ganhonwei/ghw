
<div class="alert alert-warning alert-dismissible hide" role="alert"></div>

<form class="form-horizontal ajax-form" method="post" action="{{urlfor "MessageController.NoticeEdit"}}">
    <input type="hidden" name="id" value="{{.notice.Id}}" />
    <div class="form-group">
    <label for="start_date" class="col-sm-2 control-label">开始时间</label>
    <div class="col-sm-3">
      <input type="text" id="start_date2" name="start_date2" value="{{date .notice.Stime "Y-m-d H:i:s" }}" class="form-control" autocomplete="off"/>
    </div>
  </div>
  <div class="form-group">
    <label for="end_date" class="col-sm-2 control-label">结束时间</label>
    <div class="col-sm-3">
      <input type="text" id="end_date2" name="end_date2" value="{{ date .notice.Etime "Y-m-d H:i:s" }}" class="form-control" autocomplete="off"/>
    </div>
  </div>
	<div class="form-group">
		<label for="num" class="col-sm-2 control-label">发送频率</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="num" name="num" value="{{.notice.Num}}" autocomplete="off" />
		</div>
    <div style="line-height: 34px;">分</div>
	</div>
	<div class="form-group">
		<label for="content" class="col-sm-2 control-label">消息内容</label>
		<div class="col-sm-5">
			<textarea name="content" id="content" class="form-control" rows="6" >{{.notice.Content}}</textarea>	
		</div>
	</div>

	<div class="clearfix form-actions">
		<div class="col-sm-offset-2 col-sm-10">
			<button type="submit" class="btn btn-info"><i class="ace-icon fa fa-check bigger-110"></i>提交</button>
			<a href="{{urlfor "MessageController.NoticeList"}}" class="btn btn-default"><i class="ace-icon fa fa-reply bigger-110"></i>返回</a>
		</div>
	</div>
</form>
