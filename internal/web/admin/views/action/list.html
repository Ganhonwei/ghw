<div class="row">
    <div class="col-xs-12">
    </div>
</div>

<div class="space-4"></div>

<div class="row">
    <div class="col-xs-12">
        <form class="form-inline" method="post" action="{{urlfor "ActionController.List"}}">
            <div class="input-group table_filtrate">
                账号查询:
                <div class="input-group input-group-sm">
                    <input type="text" id="userid" name="userid" value="{{.userid}}" class="form-control"
                        autocomplete="off" />
                    <span class="input-group-addon">
                        <i class="ace-icon fa fa-users"></i>
                    </span>
                </div>
            </div>
            <div class="input-group table_filtrate">
                生成时间:
                <div class="input-group input-group-sm">
                    <input type="text" id="start_date" name="start_date" value="{{.startDate}}" class="form-control"
                        autocomplete="off" />
                    <span class="input-group-addon">
                        <i class="ace-icon fa fa-calendar"></i>
                    </span>
                </div>
                至
                <div class="input-group input-group-sm">
                    <input type="text" id="end_date" name="end_date" value="{{.endDate}}" class="form-control"
                        autocomplete="off" />
                    <span class="input-group-addon">
                        <i class="ace-icon fa fa-calendar"></i>
                    </span>
                </div>
            </div>
            <div class="input-group input-group-sm">
                <button type="submit" class="btn">查询</button>
            </div>
        </form>
        <div class="space-4"></div>

        <div class="table-panel" table-wrap="260">
            <table class="table table-striped table-bordered table-hover">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>操作人</th>
                        <th>操作行为</th>
                        <th>备注</th>
                    </tr>
                </thead>
                <tbody>
                    {{range $k, $v := .list}}
                    <tr>
                        <td>{{date $v.CreateTime "Y-m-d H:i:s"}}</td>
                        <td>{{$v.Actor}}</td>
                        <td>{{$v.ActionName}}</td>
                        <td>{{$v.Message}}</td>
                    </tr>
                    {{end}}
                    {{if eq .count 0}}
                    <tr>
                        <td colspan="20">暂无记录...</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
        <div class="row">
            <div class="row-page">
                {{if gt .count 20}}
                {{str2html .pageBar}}
                {{end}}
            </div>
        </div>
    </div>
</div>

<script>
	$(document).ready(function() { _StickyMemory() });
</script>
