
<div class="alert alert-warning alert-dismissible hide" role="alert"></div>

<form class="form-horizontal ajax-form" method="post" action="{{urlfor "PlayerController.EditDiamond"}}">
	<input type="hidden" name="id" value="{{.player.Userid}}" />
	<div class="form-group">
		<label for="userid" class="col-sm-2 control-label">用户ID</label>
		<div class="col-sm-3">
			<label class="control-label">{{.player.Userid}}</label>
		</div>
	</div>
	<div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">昵称</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="nickname" name="nickname" value="{{.player.Nickname}}" disabled autocomplete="off"/>
		</div>
	</div>
	<div class="form-group">
		<label for="diamond" class="col-sm-2 control-label">修改金币</label>
		<div class="col-sm-3">
			<input type="number" class="form-control" id="diamond" name="diamond" autocomplete="off" required/>
		</div>
		<div style="line-height: 34px; color: red;">说明：充值1=0.01元，充值100=1元。</div>
	</div>
	<div class="form-group">
		<label for="diamond" class="col-sm-2 control-label">备注</label>
		<div class="col-sm-5">
			<textarea name="remark" id="remark" class="form-control" rows="6" required></textarea>	
		</div>
	</div>
	<div class="clearfix form-actions">
		<div class="col-sm-offset-2 col-sm-10">
			<button type="submit" class="btn btn-info"><i class="ace-icon fa fa-check bigger-110"></i>修改</button>
			<a href="{{urlfor "PlayerController.List"}}" class="btn btn-default"><i class="ace-icon fa fa-reply bigger-110"></i>返回</a>
		</div>
	</div>
</form>
