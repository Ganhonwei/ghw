<div class="row">
    <div class="col-xs-12">
        <form class="form-horizontal ajax-form" method="post" action="{{urlfor "PlayerController.ExternalDetails"}}">
            <div class="form-group" style="border-bottom:1px solid #DCDFE6">
                <div class="col-sm-12" style="padding-bottom:10px;">
                    <label for="number" class="col-sm-2 lable-top">局号：{{.info.RoundId}}</label>
                    <label for="number" class="col-sm-2 lable-top">游戏房间：{{.info.GameId}}</label>
                    <label for="number" class="col-sm-2 lable-top">所玩游戏：{{.info.GameName}}</label>
                    <label for="number" class="col-sm-12 lable-top">
                        <div style="float: left;">
                            参与玩家ID：
                        </div>
                        <div class="players-panel">{{.info.UserId}}</div>
                    </label>
                    <div class="page-close">
                        <a href="{{urlfor "PlayerController.PlayList" "id" .userid "type_id" .typeId "start_date" .startDate "end_date" .endDate "record_id" .recordId "room_id" .roomId}}" class="btn btn-default"><i
                            class="fa fa-close"></i></a>
                    </div>
                </div>
            </div>
</form>
<table class="table table-striped table-bordered table-hover">
    <thead>
        <tr>
            <th>下注用户ID</th>
            <th>下注金额</th>
            <th>返奖金额</th>
        </tr>
    </thead>
    <tbody>
        {{range $k, $v := .info.RewardDetail}}
        <tr>
            <td>{{ $v.UserId }}</td>
            <td>{{ printf "%.2f" $.info.FAmount }}</td>
            <td>{{ printf "%.2f" $v.FAmount }}</td>
        </tr>
        {{end}}
    </tbody>
</table>

</div>
</div>
