<div class="alert alert-warning alert-dismissible hide" role="alert"></div>
<form class="form-horizontal ajax-form" method="post" action="{{urlfor "PlayerController.Edit"}}">
    <input type="hidden" name="id" value="{{.player.Userid}}" />
    <div class="form-group col-sm-12" >
        <label for="userid" class="col-sm-2 control-label">玩家头像:</label>
        <div class="col-sm-8">
			{{if eq .user.PhotoUrl ""}}
			<img  style="border-radius: 50px;"  src="assets/avatars/img_{{.user.Photo}}.png" id="photo" name="photo" alt="" width="100px" height="100px">
			{{else}}
			<img style="border-radius: 50px;"  src="{{.user.PhotoUrl}}" id="photo" name="photo" alt="" width="100px" height="100px">
			{{end}}
        </div>
    </div>
	<div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">昵称</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="nickname" name="nickname" value="{{.user.Nickname}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">手机号</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="phone" name="phone" value="{{.user.Phone}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">银行名称</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="bankname" name="bankname" value="{{.user.Phone}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">银行卡号</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="accounts" name="accounts" value="{{.user.Phone}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">持卡人姓名</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="realname" name="realname" value="{{.user.RealName}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">AFID</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="afid" name="afid" value="{{.user.AfId}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">OS</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="os" name="os" value="{{.user.OsVersion}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">BundleID</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="bundleId" name="bundleId" value="{{.user.BundleId}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">RefGameID</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="refGameID" name="refGameID" value="{{.user.Phone}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">RefPkgName</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="refName" name="refName" value="{{.user.AfKey}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">MediaSource</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="mediasource" name="mediasource" value="{{.user.MediaSource}}" autocomplete="off" />
		</div>
	</div>
	<div class="clearfix form-actions">
		<div class="col-sm-offset-2 col-sm-10">
			<button type="submit" class="btn btn-info"><i class="ace-icon fa fa-check bigger-110"></i>提交</button>
			<a href="{{urlfor "PlayerController.List"}}" class="btn btn-default"><i class="ace-icon fa fa-reply bigger-110"></i>返回</a>
		</div>
	</div>
</form>
