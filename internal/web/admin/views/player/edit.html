
<div class="alert alert-warning alert-dismissible hide" role="alert"></div>

<form class="form-horizontal ajax-form" method="post" action="{{urlfor "PlayerController.Edit"}}">
    <input type="hidden" name="id" value="{{.user.Userid}}" />
    <div class="form-group col-sm-12" >
        <label for="userid" class="col-sm-2 control-label">玩家头像：</label>
        <div class="col-sm-8">
			{{if eq .user.PhotoUrl ""}}
			<img  style="border-radius: 50px;"  src="assets/avatars/img_{{.user.Photo}}.png" id="photo" name="photo" alt="" width="100px" height="100px">
			{{else}}
			<img style="border-radius: 50px;"  src="{{.user.PhotoUrl}}" id="photo" name="photo" alt="" width="100px" height="100px">
			{{end}}
        </div>
    </div>
	<div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">昵称：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="nickname" name="nickname" value="{{.user.Nickname}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">登录手机号：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="phone" name="phone" value="{{.user.Phone}}" autocomplete="off" readonly />
		</div>
	</div>
	<div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">提现手机号：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="phone2" name="phone2" value="{{.user.Phone2}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">银行名称：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="bankname" name="bankname" value="{{.user.Bank}}" autocomplete="off" />
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">银行卡号：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="accounts" name="accounts" value="{{.user.BankAccounts}}" autocomplete="off" />
		</div>
	</div>
	<div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">IFSC：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="ifsc" name="ifsc" value="{{.user.IFSC}}" autocomplete="off"/>
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">持卡人姓名：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="realname" name="realname" value="{{.user.RealName}}" autocomplete="off" />
		</div>
	</div>
	<div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">AppId：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="appid" name="appid" value="{{.user.AD_AppId}}" autocomplete="off"/>
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">ADID：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="afid" name="afid" value="{{.user.AD_ADID}}" autocomplete="off"/>
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">OS：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="os" name="os" value="{{.user.AD_OsVersion}}" autocomplete="off"/>
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">BundleID：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="bundleId" name="bundleId" value="{{.user.AD_BundleId}}" autocomplete="off" />
		</div>
	</div>
	<div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">RefGameId：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="refgameid" name="refgameid" value="{{.user.AD_RefGameId}}" autocomplete="off"/>
		</div>
	</div>
	<div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">RefPkgName：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="refpkgname" name="refpkgname" value="{{.user.AD_RefPkgName}}" autocomplete="off"/>
		</div>
	</div>
    <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">ADKey：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="afKey" name="afKey" value="{{.user.AD_Key}}" autocomplete="off" />
		</div>
	</div>
    <!-- <div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">AD_Tracker_Channel：</label>
		<div class="col-sm-3">
			<input type="text" class="form-control" id="mediasource" name="mediasource" value="{{.user.AD_Tracker_Channel}}" autocomplete="off" />
		</div>
	</div> -->
	<div class="form-group">
		<label for="nickname" class="col-sm-2 control-label">评分：</label>
		<div class="col-sm-3">
			{{if eq .user.AndroidScore -1}}
				<input type="text" class="form-control" id="androidScore" name="androidScore" value="-" readonly autocomplete="off" />
			{{else}}
				<input type="text" class="form-control" id="androidScore" name="androidScore" value="{{.user.AndroidScore}}" readonly autocomplete="off" />
			{{end}}
		</div>
	</div>
	<div class="clearfix form-actions">
		<div class="col-sm-offset-2 col-sm-10">
			<button type="submit" class="btn btn-info"><i class="ace-icon fa fa-check bigger-110"></i>保存</button>
			<a href="{{urlfor "PlayerController.List"}}" class="btn btn-default"><i class="ace-icon fa fa-reply bigger-110"></i>返回</a>
		</div>
	</div>
</form>
