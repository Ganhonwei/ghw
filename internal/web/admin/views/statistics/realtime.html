<div class="row">
    <div class="col-xs-12">
    </div>
  </div>
  <div class="row">
    <div class="col-xs-12">
      <form class="form-inline" method="post" action="{{urlfor "StatisticsController.UserGames"}}">
      <input type="hidden" name="typeId" value="{{.typeId}}" />
              <div class="input-group table_filtrate">
                  时间:
                  <div class="input-group input-group-sm">
                      <input type="text" id="start_date" name="start_date" value="{{.startDate}}" class="form-control" autocomplete="off"/>
                      <span class="input-group-addon">
                          <i class="ace-icon fa fa-calendar"></i>
                      </span>
                  </div>
              </div>
              <div class="input-group table_filtrate">
                <div class="input-group input-group-sm">
                  <select name="type_id">
                    {{range $k,$v := .typeList}}
                    <option value="{{$k}}" {{if eq $.typeId $k}}selected{{end}}>{{$v}}</option>
                    {{end}}
                  </select>
                </div>
              </div>
        <div class="input-group input-group-sm">
          <button type="submit" class="btn">查询</button>
        </div>
      </form>
    </div>
  </div>
  <div class="space-4"></div>
  
  <div class="row" style="width: 1000px;">
    <div class="col-xs-12 center">
  
      <!-- <canvas id="online" width="100" height="120"></canvas> -->
      <canvas id="online"></canvas>
      <script src="../../assets/js/Chart.js"></script>
      <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.js"></script> -->
      <script>
        var ctx = document.getElementById('online').getContext('2d');
        var timelabel = {{.TimeLabel}}; // 日期
        var currentData = {{.CurrentData}}; // 当前小时的数据
        var beforeData = {{.BeforeData}}; // 前一日同一时间段的数据
        var chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels:timelabel,
                datasets: [{
                    label: '当前',
                    data: currentData,
                    backgroundColor: 'rgba(0, 123, 255, 0.1)',
                    borderColor: 'rgba(0, 123, 255, 1)',
                    borderWidth: 1
                }, {
                    label: '前一日',
                    data: beforeData,
                    backgroundColor: 'rgba(255, 99, 132, 0.1)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
