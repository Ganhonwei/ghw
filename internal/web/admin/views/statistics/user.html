<div class="row">
	<div class="col-xs-12">
		<form class="form-inline" method="post" action="{{urlfor "StatisticsController.User"}}">
            <div class="input-group table_filtrate">
				状态:
				<div class="input-group input-group-sm">
					<select name="status_id">
						{{range $k,$v := .statusList}}
						<option value="{{$k}}" {{if eq $.statusId $k}}selected{{end}}>{{$v}}</option>
						{{end}}
					</select>
				</div>
			</div>
			<div class="input-group table_filtrate">
				时间:
				<div class="input-group input-group-sm">
					<input type="text" id="start_date" name="start_date" value="{{.startDate}}" class="form-control" autocomplete="off"/>
					<span class="input-group-addon">
						<i class="ace-icon fa fa-calendar"></i>
					</span>
				</div>
				至
				<div class="input-group input-group-sm">
					<input type="text" id="end_date" name="end_date" value="{{.endDate}}" class="form-control" autocomplete="off"/>
					<span class="input-group-addon">
						<i class="ace-icon fa fa-calendar"></i>
					</span>
				</div>
			</div>
           

			<div class="input-group input-group-sm">
				<button type="submit" class="btn">查询</button>
                <!-- <button type="submit" class="btn">导出</button> -->
			</div>
	</div>
</div>
</form>
<div class="space-4"></div>

<div class="table-panel">
	<table class="table table-striped table-bordered table-hover">
		<thead>
		<tr>
			<th>时间</th>
			<th>用户数</th>
			<th>携带彩金总额</th>
			<!-- <th>携带奖励金总额</th> -->
		</tr>
		</thead>
	<tbody>
		{{range $k, $v := .list}}
			<tr>
				<td>{{ date $v.SDate "Y-m-d" }}</td>
				<td>{{ $v.UserNumber }}</td>
				<td>{{ printf "%.2f" $v.Diamond }}</td>
				<!-- <td>{{ printf "%.2f" $v.Coin }}</td> -->
			</tr>
		{{end}}
		</tbody>
	</table>
</div>
<div class="row">
	<div class="row-page"> 
		{{if gt .count 20}}
		{{str2html .pageBar}}
	{{end}}
	</div>
</div>
</div>
</div>
