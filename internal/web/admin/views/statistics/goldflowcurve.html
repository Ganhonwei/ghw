<div class="space-4"></div>
<div class="row">
	<div class="col-xs-12">
		<form class="form-inline" method="post" action="{{urlfor "StatisticsController.GoldFlowCurve"}}">
			<input type="hidden" name="status" value="{{.status}}" />
			<div class="input-group table_filtrate">
                查询:
                <div class="input-group input-group-sm">
                    <input type="text" id="userid" name="userid" value="{{.userid}}" class="form-control"
                        placeholder="用户ID" autocomplete="off" />
                </div>
            </div>
            <div class="input-group table_filtrate">
				时间:
				<div class="input-group input-group-sm">
					<input type="text" id="start_date" name="start_date" value="{{.startDate}}" class="form-control" autocomplete="off"/>
					<span class="input-group-addon">
						<i class="ace-icon fa fa-calendar"></i>
					</span>
				</div>
				至
				<div class="input-group input-group-sm">
					<input type="text" id="end_date" name="end_date" value="{{.endDate}}" class="form-control" autocomplete="off"/>
					<span class="input-group-addon">
						<i class="ace-icon fa fa-calendar"></i>
					</span>
				</div>
			</div>
            <div class="input-group table_filtrate">
                起始局:
                <div class="input-group input-group-sm">
                    <input type="number" id="game_statr" name="game_statr" value="{{.game_statr}}"
                        class="form-control number-input" autocomplete="off" />
                </div>
            </div>
            <div class="input-group table_filtrate">
                结束局:
                <div class="input-group input-group-sm">
                    <input type="number" id="game_end" name="game_end" value="{{.game_end}}"
                        class="form-control number-input" autocomplete="off" />
                </div>
            </div>
            <div class="input-group table_filtrate">
                近期局数:
                <div class="input-group input-group-sm">
                    <input type="number" id="lately_game" name="lately_game" value="{{.lately_game}}"
                        class="form-control number-input" autocomplete="off" />
                </div>
            </div>
            <div class="input-group input-group-sm">
                <button type="submit" class="btn">查询</button>
            </div>
		</form>
		<div class="space-4"></div>
		<div class="row" style="width: 95%">
            <div class="col-xs-12 center">
          
              <!-- <canvas id="online" width="100" height="120"></canvas> -->
              <canvas id="info"></canvas>
              <script src="../../assets/js/Chart.js"></script>
              
              <script>
                var ctx = document.getElementById('info').getContext('2d');
                var timelabel = {{.TimeLabel }}; // 日期
                var Data1 = {{.XD }}; // 携带
                var Data2 = {{.ZYK }}; // 总盈亏
                var Data3 = {{.PAY}}; // 充值
                var Data4 = {{.WithDraw}}; // 提现
                var Data_cause = {{.Cause }}; //携带的变化原因
                var chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels:timelabel,
                        datasets: [{
                            label: '携带金币',
                            data: Data1,
                            backgroundColor: 'rgba(0, 0, 0, 0)', // 设置为透明色
                            borderColor: 'rgba(0, 123, 255, 1)',
                            borderWidth: 1
                        }
                        ,{
                            label: '总盈亏',
                            data: Data2,
                            backgroundColor: 'rgba(0, 0, 0, 0)', // 设置为透明色
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 1
                        }
                        ,{
                            label: '充值金额',
                            data: Data3,
                            backgroundColor: 'rgba(0, 0, 0, 0)', // 设置为透明色
                            borderColor: 'rgba(252, 186, 3, 1)',
                            borderWidth: 1
                        },{
                            label: '提现金额',
                            data: Data4,
                            backgroundColor: 'rgba(0, 0, 0, 0)', // 设置为透明色
                            borderColor: 'rgb(20, 252, 3,1)',
                            borderWidth: 1
                        }
                      ]
                    },
                    options: {
                        scales: {
                        xAxes: [{
                            ticks: {
                                beginAtZero: true,
                                maxRotation: 50,  // 最大旋转角度
                                callback: function (value, index, values) {
                                    if (values.length > 300) {
                                        return index % 10 === 0 ? value : '';
                                    } 
                                    else {
                                        return value;
                                    }
                                }
                            }
                        }]
                    },
                    tooltips: {
                        useHTML: true, // 启用 HTML 解析
                        callbacks: {
                            label: function (tooltipItem, data) {
                                if (tooltipItem.datasetIndex == 0) {
                                    // 携带金币
                                    var wid = data.labels[tooltipItem.index];
                                    var info = Data_cause.find(item => item.id === wid);
                                    // var msg = Data_cause.find(item => item.id === wid).wid;

                                    var label = ["账变后金币：" + tooltipItem.yLabel];
                                    // label.push("局号：(" + info.wid + ")");
                                    label.push("参与游戏：" + info.game + "");
                                    label.push("金币变化：" + info.msg + "");
                                    label.push("总充值：" + info.pay + "");
                                    return label;
                                } else {
                                    var label = data.datasets[tooltipItem.datasetIndex].label || '';
                                    label += ': ' + tooltipItem.yLabel + '';
                                    return label;
                                }
                            }
                        }
                    }
                    }
                });
            </script>
            </div>
          </div>
	</div>
</div>
