  <div class="row" style="width: 1000px;">
    <div class="col-xs-12">
      <form class="form-inline" method="post" action="{{urlfor "StatisticsController.GameCharts"}}">
      <input type="hidden" name="id" value="{{.pid}}" />
      <div class="input-group table_filtrate">
        类型:
        <div class="input-group input-group-sm">
            <select name="dtype" id="dtype">
                {{range $k,$v := .dtype}}
                <option value="{{$k}}" {{if eq $.dtypeId $k}}selected{{end}}>{{$v}}</option>
                {{end}}
            </select>
        </div>
    </div>
        <div class="input-group input-group-sm">
          <button type="submit" class="btn">查询</button>
        </div>
        <div style="display: inline-block; float: right;">
            <a href="{{urlfor "StatisticsController.PointList"}}" class="btn btn-default"><i class="fa fa-close"></i></a>
        </div>
      </form>
    </div>
  </div>
  <div class="space-4"></div>
  
  <div class="row" style="width: 1000px;">
    <div class="col-xs-12 center">
  
      <!-- <canvas id="online" width="100" height="120"></canvas> -->
      <canvas id="online"></canvas>
      <script src="../../assets/js/Chart.js"></script>
      <script>
  
        var ctx = document.getElementById("online");
        var chartData = {{.gamedata}}; 
  var online = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ["TP",  "RUMMY","AK47","JOKER","DRAGON TIGER", "7UPDOWN",  "CRASH"],
      datasets: [{
        label: '人数',
        data: chartData,
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        borderColor: 'rgba(54, 162, 235, 1)',
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        yAxes: [{
          ticks: {
            beginAtZero:true
          }
        }]
      }
    }
  });
  </script>
    </div>
  </div>
